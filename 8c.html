const LEGACY_STICKER_MAP = {
  cb_1: 'pd_5', cb_2: 'pd_1', cb_3: 'pd_2', cb_4: 'pd_3', cb_5: 'pd_3',
  cb_6: 'pd_6', cb_7: 'pd_2', cb_8: 'pd_4', cb_9: 'pd_7', cb_10: 'pd_8',
  cg_1: 'pd_9', cg_2: 'pd_10', cg_3: 'pd_11', cg_4: 'pd_12', cg_5: 'pd_13',
  cg_6: 'pd_14', cg_7: 'pd_10', cg_8: 'pd_15', cg_9: 'pd_16', cg_10: 'pd_9'
};

function getStickerById(id) {
  const resolvedId = LEGACY_STICKER_MAP[id] || id;
  for (const p of STICKER_PACKS) {
    const found = p.stickers.find(s => s.id === resolvedId);
    if (found) return found;
  }
  return null;
}

function renderStickerSVG(sticker, compact = false) {
  if (!sticker) return '';
  const sizeClass = compact ? 'w-20 h-20 sm:w-24 sm:h-24' : 'w-32 h-32 sm:w-36 sm:h-36';
  return `<img src="${sticker.img}" alt="${esc(sticker.text)}" title="${esc(sticker.text)}" loading="lazy" class="${sizeClass} object-contain select-none shrink-0 drop-shadow-[0_6px_14px_rgba(0,0,0,0.45)] transition-transform duration-150 ${compact ? 'hover:scale-110' : ''}" />`;
}

// 靜默禁止帳號與密碼輸入中文（無任何提示字眼，輸入即自動過濾）
function enforceAsciiInput(el) {
  if (!el) return;
  const cleaned = el.value.replace(/[^\x21-\x7E]/g, '');
  if (el.value !== cleaned) {
    const pos = el.selectionStart;
    el.value = cleaned;
    try { el.setSelectionRange(Math.max(0, pos - 1), Math.max(0, pos - 1)); } catch (_) {}
  }
}

function makeDefaultAvatarDataUrl(initials, bg1, bg2) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs><rect width="240" height="240" fill="url(#g)"/><circle cx="120" cy="92" r="38" fill="rgba(255,255,255,0.16)"/><path d="M56 210c8-40 34-62 64-62s56 22 64 62" fill="rgba(255,255,255,0.14)"/><text x="120" y="110" text-anchor="middle" fill="#f4f4f5" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="46">${initials}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ==========================================
// 通用工具函式
// ==========================================
function uid(prefix = 'id') {
  return prefix + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}
function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function validatePasswordStrength(pwd) {
  const s = String(pwd || '');
  const hasUpper = /[A-Z]/.test(s);
  const hasLower = /[a-z]/.test(s);
  const digitCount = (s.match(/\d/g) || []).length;
  return {
    valid: hasUpper && hasLower && digitCount >= 5,
    hasUpper,
    hasLower,
    digitCount,
    hasFiveDigits: digitCount >= 5
  };
}

// ==========================================
// 密碼單向雜湊模組（PBKDF2-HMAC-SHA256，防止 F12 竊取明文密碼）
// ==========================================
const PASSWORD_HASH_ITERATIONS = 10000;

function bytesToHex(bytes) {
  let hex = '';
  for (let i = 0; i < bytes.length; i++) {
    hex += bytes[i].toString(16).padStart(2, '0');
  }
  return hex;
}

function utf8ToBytes(str) {
  if (typeof TextEncoder !== 'undefined') {
    return new TextEncoder().encode(str);
  }
  const encoded = unescape(encodeURIComponent(str));
  const arr = new Uint8Array(encoded.length);
  for (let i = 0; i < encoded.length; i++) arr[i] = encoded.charCodeAt(i);
  return arr;
}

function generateSaltHex(byteLen = 16) {
  const bytes = new Uint8Array(byteLen);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(bytes);
  } else {

  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
]);

function sha256Bytes(msgBytes) {
  const len = msgBytes.length;
  const bitLenHi = Math.floor((len * 8) / 0x100000000);
  const bitLenLo = (len * 8) >>> 0;
  const paddedLen = ((len + 9 + 63) & ~63);
  const padded = new Uint8Array(paddedLen);
  padded.set(msgBytes);
  padded[len] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(paddedLen - 8, bitLenHi, false);
  view.setUint32(paddedLen - 4, bitLenLo, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let offset = 0; offset < paddedLen; offset += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = ((w[i - 15] >>> 7) | (w[i - 15] << 25)) ^ ((w[i - 15] >>> 18) | (w[i - 15] << 14)) ^ (w[i - 15] >>> 3);
      const s1 = ((w[i - 2] >>> 17) | (w[i - 2] << 15)) ^ ((w[i - 2] >>> 19) | (w[i - 2] << 13)) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }

  const out = new Uint8Array(32);
  const outView = new DataView(out.buffer);
  outView.setUint32(0, h0, false); outView.setUint32(4, h1, false);
  outView.setUint32(8, h2, false); outView.setUint32(12, h3, false);
  outView.setUint32(16, h4, false); outView.setUint32(20, h5, false);
  outView.setUint32(24, h6, false); outView.setUint32(28, h7, false);
  return out;
}

function hmacSha256Bytes(keyBytes, msgBytes) {
  let k = keyBytes;
  if (k.length > 64) k = sha256Bytes(k);
  const blockKey = new Uint8Array(64);
  blockKey.set(k);
  const oPad = new Uint8Array(64 + 32);
  const iPad = new Uint8Array(64 + msgBytes.length);
  for (let i = 0; i < 64; i++) {
    oPad[i] = blockKey[i] ^ 0x5c;
    iPad[i] = blockKey[i] ^ 0x36;
  }
  iPad.set(msgBytes, 64);
  const inner = sha256Bytes(iPad);
  oPad.set(inner, 64);
  return sha256Bytes(oPad);
}

function pbkdf2Sha256FallbackHex(password, salt, iterations) {
  const pwdBytes = utf8ToBytes(password);
  const saltBytes = utf8ToBytes(salt);
  const block1 = new Uint8Array(saltBytes.length + 4);
  block1.set(saltBytes);
  block1[saltBytes.length + 3] = 1;
  let u = hmacSha256Bytes(pwdBytes, block1);
  const t = new Uint8Array(u);
  for (let i = 1; i < iterations; i++) {
    u = hmacSha256Bytes(pwdBytes, u);
    for (let j = 0; j < 32; j++) t[j] ^= u[j];
  }
  return bytesToHex(t);
}

async function derivePasswordHashHex(password, salt, iterations = PASSWORD_HASH_ITERATIONS) {
  if (window.crypto && window.crypto.subtle) {
    try {
      const keyMaterial = await window.crypto.subtle.importKey(
        'raw', utf8ToBytes(password), { name: 'PBKDF2' }, false, ['deriveBits']
      );
      const bits = await window.crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: utf8ToBytes(salt), iterations, hash: 'SHA-256' },
        keyMaterial,
        256
      );
      return bytesToHex(new Uint8Array(bits));
    } catch (_) {}
  }
  return pbkdf2Sha256FallbackHex(password, salt, iterations);
}

async function createPasswordRecord(plainPassword) {
  const passwordSalt = generateSaltHex(16);
  const hashIterations = PASSWORD_HASH_ITERATIONS;
  const passwordHash = await derivePasswordHashHex(plainPassword, passwordSalt, hashIterations);
  return { passwordHash, passwordSalt, hashIterations };
}

function constantTimeEqual(a, b) {
  const sa = String(a || '');
  const sb = String(b || '');
  if (sa.length !== sb.length) return false;
  let diff = 0;
  for (let i = 0; i < sa.length; i++) diff |= sa.charCodeAt(i) ^ sb.charCodeAt(i);
  return diff === 0;
}

async function verifyPasswordRecord(account, inputPassword) {
  if (!account) return false;
  if (account.passwordHash && account.passwordSalt) {
    const iters = Number(account.hashIterations || PASSWORD_HASH_ITERATIONS);
    const derived = await derivePasswordHashHex(inputPassword, account.passwordSalt, iters);
    return constantTimeEqual(derived, account.passwordHash);
  }
  if (typeof account.password === 'string') {
    const ok = constantTimeEqual(account.password, inputPassword);
    if (ok) {
      const rec = await createPasswordRecord(inputPassword);
      Object.assign(account, rec);
      delete account.password;
      saveState();
    }
    return ok;
  }
  return false;
}

async function migratePlaintextPasswordsIfNeeded() {
  let changed = false;
  const groups = [state.admins, state.teachers, state.students, state.registrations];
  for (const list of groups) {
    if (!Array.isArray(list)) continue;
    for (const item of list) {
      if (item && typeof item.password === 'string' && item.password.length > 0) {
        if (!item.passwordHash || !item.passwordSalt) {
          const rec = await createPasswordRecord(item.password);
          Object.assign(item, rec);
        }
        delete item.password;
        changed = true;
      } else if (item && 'password' in item) {
        delete item.password;
        changed = true;
      }
    }
  }
  if (changed) saveState();
}


function detectSensitiveContact(text) {

  return [
    /09\d{2}[-\s]?\d{3}[-\s]?\d{3}/i,
    /\b\d{8,12}\b/,
    /(line\s*id|加\s*line|賴我|加賴|私賴|@[\w.-]{3,})/i,

function compressImageFile(file, maxDim = 480, quality = 0.78) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) {
      reject(new Error('請選擇圖片檔案（JPG / PNG / WebP）'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('圖片讀取失敗'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('檔案讀取失敗'));
    reader.readAsDataURL(file);
  });
}

    { key: 'bio', label: '個人簡介（至少 10 字）', ok: (t.bio || '').trim().length >= 10 },
    { key: 'contact', label: '成課聯絡方式', ok: (t.contact || '').trim().length >= 4 }
  ];
  const doneCount = checks.filter(c => c.ok).length;
  const percent = Math.round((doneCount / checks.length) * 100);
  const missing = checks.filter(c => !c.ok);
  const hasPhoto = checks[0].ok;
  // 必須有大頭貼且完成度達 100% 才解鎖開課
  return {
    checks,
    doneCount,
    total: checks.length,
    percent,
    missing,
    canOpenCourse: hasPhoto && doneCount === checks.length
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createInitialState();
    const parsed = JSON.parse(raw);
    const base = createInitialState();
    return {
      ...base,
      ...parsed,
      admins: Array.isArray(parsed.admins) && parsed.admins.length ? parsed.admins : base.admins,
      registrations: Array.isArray(parsed.registrations) ? parsed.registrations : [],
      teachers: Array.isArray(parsed.teachers) ? parsed.teachers : base.teachers,
      students: Array.isArray(parsed.students) ? parsed.students : base.students,
      bookings: Array.isArray(parsed.bookings) ? parsed.bookings : [],
      wishes: Array.isArray(parsed.wishes) ? parsed.wishes : base.wishes,
      events: Array.isArray(parsed.events) ? parsed.events : base.events,
      approvals: Array.isArray(parsed.approvals) ? parsed.approvals : [],
      supportChats: parsed.supportChats || {},
      pairChats: parsed.pairChats || {},
      ledger: Array.isArray(parsed.ledger) ? parsed.ledger : []
    };
  } catch (e) {
    return createInitialState();
  }
}

function saveState() {
  try {
    [state.admins, state.teachers, state.students, state.registrations].forEach(list => {
      if (Array.isArray(list)) list.forEach(item => { if (item && 'password' in item) delete item.password; });
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('本地儲存空間不足，請減少高解析度照片數量。', 'error');
  }
}

// 查詢輔助函式
// ==========================================
function getTeacherById(id) { return state.teachers.find(t => t.id === id) || null; }
function getStudentById(id) { return state.students.find(s => s.id === id) || null; }
function getAdminById(id) { return state.admins.find(a => a.id === id) || null; }

function getCurrentUser() {
  if (!state.session || state.session.role === 'guest') return null;
  if (state.session.role === 'admin') {
    const a = getAdminById(state.session.id) || state.admins[0];
    return a ? { ...a, role: 'admin' } : null;
  }
  if (state.session.role === 'teacher') {
    const t = getTeacherById(state.session.id);
    return t ? { ...t, role: 'teacher' } : null;
  }
  if (state.session.role === 'student') {
    const s = getStudentById(state.session.id);
    return s ? { ...s, role: 'student' } : null;
  }
  return null;
}

function isUsernameTaken(username, excludeRole = null, excludeId = null) {
  const u = String(username || '').trim().toLowerCase();
  if (!u) return true;
  if (state.admins.some(a => a.username.toLowerCase() === u && !(excludeRole === 'admin' && a.id === excludeId))) return true;
  if (state.teachers.some(t => t.username.toLowerCase() === u && !(excludeRole === 'teacher' && t.id === excludeId))) return true;
  if (state.students.some(s => s.username.toLowerCase() === u && !(excludeRole === 'student' && s.id === excludeId))) return true;
  if (state.registrations.some(r => r.status === 'pending' && r.username.toLowerCase() === u)) return true;
  return false;
}

function getTeacherAvgRating(t) {
  const revs = (t.reviews || []).filter(r => !r.studentId || getStudentById(r.studentId));
  if (!revs.length) return '新進師資';
  const avg = revs.reduce((sum, r) => sum + Number(r.rating || 5), 0) / revs.length;
  return `${avg.toFixed(1)} ★ (${revs.length})`;
}

function getAttendanceRate(s) {
  const total = (s.completedCount || 0) + (s.noShowCount || 0);
  if (total === 0) return '100%（新學員）';
  return `${Math.round(((s.completedCount || 0) / total) * 100)}%（完課 ${s.completedCount} / 爽約 ${s.noShowCount}）`;
}

function hasActiveEscrowBetween(studentId, teacherId) {
  return state.bookings.some(b => b.studentId === studentId && b.teacherId === teacherId && (b.status === 'escrowed' || b.status === 'completed'));
}

function getPendingAdminTaskCount() {
  const pendingRegs = state.registrations.filter(r => r.status === 'pending').length;
  const pendingApprovals = state.approvals.filter(a => a.status === 'pending').length;
  const flaggedChats = Object.values(state.pairChats).filter(c => c.flagged).length;
  return pendingRegs + pendingApprovals + flaggedChats;
}

function getSlotRemaining(sl) {
  const max = Math.max(1, Number(sl.maxStudents || 1));
  const enrolled = Number(sl.enrolledCount || 0);
  return Math.max(0, max - enrolled);
}

function getOpenSlots(t) {
  return (t.slots || []).filter(sl => sl.status === 'open' && getSlotRemaining(sl) > 0);
}

function getTeacherPriceSummary(t) {
  const open = getOpenSlots(t);
  if (!open.length) return '暫無開課';
  const prices = open.map(s => Number(s.price || 0)).filter(p => p > 0);
  if (!prices.length) return '洽詢價格';
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  return min === max ? `${min.toLocaleString()} pts` : `${min.toLocaleString()} ~ ${max.toLocaleString()} pts`;
}

function renderAvatar(photo, name, sizeClass = 'w-12 h-12', textClass = 'text-base') {
  if (photo) {
    return `<img src="${photo}" alt="${esc(name)}" class="${sizeClass} rounded-xl object-cover border border-white/15 shrink-0 bg-zinc-900" />`;
  }
  const initial = (name || '?').trim().slice(0, 1).toUpperCase();
  return `<div class="${sizeClass} rounded-xl bg-gradient-to-br from-lime-300/20 to-amber-400/20 border border-white/10 text-lime-200 font-bold ${textClass} flex items-center justify-center shrink-0">${esc(initial)}</div>`;
}

// ==========================================
// 刪除老師／學生帳號同步連動清除（含許願單、行事曆、聊天室、預約、評價）
// ==========================================
function deleteAccountCascade(role, id) {
  if (role === 'teacher') {
    const teacher = getTeacherById(id);
    if (!teacher) return;

    state.bookings.forEach(b => {
      if (b.teacherId === id && b.status === 'escrowed') {
        const stu = getStudentById(b.studentId);
        if (stu) stu.points += Number(b.totalPoints || 0);
        state.escrowPoolPoints = Math.max(0, state.escrowPoolPoints - Number(b.totalPoints || 0));
        state.ledger.unshift({
          id: uid('lg'),
          type: 'refund',
          desc: `刪除老師「${teacher.name}」同步取消預約，退還 ${stu ? stu.name : '學生'} 點數`,
          amount: -Number(b.totalPoints || 0),
          createdAt: nowStr()
        });
      }
    });
    state.bookings = state.bookings.filter(b => b.teacherId !== id);

    state.events.forEach(ev => {
      ev.attendees = (ev.attendees || []).filter(a => !(a.userId === id && a.role === 'teacher'));
      ev.comments = (ev.comments || []).filter(c => !(c.userId === id && c.role === 'teacher'));
    });

    state.wishes.forEach(w => {
      if (w.targetTeacherId === id) w.targetTeacherId = '';
    });

    state.approvals = state.approvals.filter(a => !(a.targetRole === 'teacher' && a.targetId === id));
    delete state.supportChats[id];
    Object.keys(state.pairChats).forEach(k => {
      if (k.endsWith('__' + id)) delete state.pairChats[k];
    });
    if (ui.activeChatTarget && ui.activeChatTarget.endsWith('__' + id)) ui.activeChatTarget = 'support';

    state.teachers = state.teachers.filter(t => t.id !== id);
    if (state.session.role === 'teacher' && state.session.id === id) {
      state.session = { role: 'guest', id: null };
    }
  } else if (role === 'student') {
    const student = getStudentById(id);
    if (!student) return;

    state.bookings.forEach(b => {
      if (b.studentId === id && b.status === 'escrowed') {
        state.escrowPoolPoints = Math.max(0, state.escrowPoolPoints - Number(b.totalPoints || 0));
        const teacher = getTeacherById(b.teacherId);
        if (teacher) {
          const slot = (teacher.slots || []).find(sl => sl.id === b.slotId);
          if (slot) {
            slot.enrolledCount = Math.max(0, Number(slot.enrolledCount || 1) - 1);
            slot.status = 'open';
          }
        }
        state.ledger.unshift({
          id: uid('lg'),
          type: 'cancel',
          desc: `刪除學生「${student.name}」同步取消預約並釋出課程名額`,
          amount: -Number(b.totalPoints || 0),
          createdAt: nowStr()
        });
      }
    });
    state.bookings = state.bookings.filter(b => b.studentId !== id);

    state.teachers.forEach(t => {
      t.reviews = (t.reviews || []).filter(r => r.studentId !== id);
    });

    state.events.forEach(ev => {
      ev.attendees = (ev.attendees || []).filter(a => !(a.userId === id && a.role === 'student'));
      ev.comments = (ev.comments || []).filter(c => !(c.userId === id && c.role === 'student'));
    });

    state.wishes = state.wishes.filter(w => w.studentId !== id);
    state.wishes.forEach(w => {
      w.upvoters = (w.upvoters || []).filter(uidStr => uidStr !== id);
    });

    state.approvals = state.approvals.filter(a => !(a.targetRole === 'student' && a.targetId === id));
    delete state.supportChats[id];
    Object.keys(state.pairChats).forEach(k => {
      if (k.startsWith(id + '__')) delete state.pairChats[k];
    });
    if (ui.activeChatTarget && ui.activeChatTarget.startsWith(id + '__')) ui.activeChatTarget = 'support';

    state.students = state.students.filter(s => s.id !== id);
    if (state.session.role === 'student' && state.session.id === id) {
      state.session = { role: 'guest', id: null };
    }
  }
  saveState();
}

function showToast(msg, type = 'success') {
  const root = document.getElementById('toast-root');
  const id = uid('toast');
  const palette = type === 'error'
    ? 'bg-red-950/95 border-red-500/40 text-red-200'
    : type === 'warn'
    ? 'bg-amber-950/95 border-amber-500/40 text-amber-200'
    : 'bg-zinc-900/95 border-lime-400/40 text-lime-200';
  const el = document.createElement('div');
  el.id = id;
  el.className = `pointer-events-auto px-4 py-3 rounded-xl border text-sm shadow-2xl fade-in ${palette}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { const target = document.getElementById(id); if (target) target.remove(); }, 3600);
}

}

  openModal(`

      <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-red-500/15 border border-red-500/30 text-red-300 text-xs font-bold">重要操作確認</div>

      <div class="p-3.5 rounded-xl bg-obsidian border border-white/10 space-y-2">

        <input id="gan-confirm-input" type="text" autocomplete="off" placeholder="請輸入指定確認字" class="w-full px-3 py-2.5 rounded-xl bg-zinc-900 border border-white/10 text-white focus:border-red-400 focus:outline-none text-sm" />
      </div>

        <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 text-sm transition">取消</button>
        <button onclick="executeGanConfirm()" class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold text-sm transition">確認執行</button>
      </div>
    </div>
  `, 'max-w-md');
  setTimeout(() => { const inp = document.getElementById('gan-confirm-input'); if (inp) inp.focus(); }, 50);
}

function executeGanConfirm() {
  const val = (document.getElementById('gan-confirm-input')?.value || '').trim();
  if (val !== '幹') {
    showToast('確認字元不符，操作已取消。', 'error');
    return;
  }
  const fn = window.__pendingConfirmAction;
  window.__pendingConfirmAction = null;
  closeModal();
  if (typeof fn === 'function') fn();
}

    if (!user) {

    if (user.role === 'admin' && (!ui.activeChatTarget || ui.activeChatTarget === 'support')) {
      const firstId = state.students[0]?.id || state.teachers[0]?.id;

  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchAuthTab(mode) {
  const loginForm = document.getElementById('auth-login-form');
  const regForm = document.getElementById('auth-register-form');
  const tabLogin = document.getElementById('auth-tab-login');
  const tabReg = document.getElementById('auth-tab-register');
  const title = document.getElementById('auth-modal-title');
  const sub = document.getElementById('auth-modal-sub');
  if (!loginForm || !regForm) return;

  if (mode === 'register') {
    loginForm.classList.add('hidden');
    regForm.classList.remove('hidden');
    tabReg.className = 'py-2 rounded-lg font-bold transition bg-lime-300 text-zinc-950';
    tabLogin.className = 'py-2 rounded-lg font-bold transition text-zinc-400 hover:text-white';
    title.textContent = '建立新帳號';
    sub.textContent = '填寫基本資料送出申請，通過審核後即可登入使用。';
  } else {
    regForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
    tabLogin.className = 'py-2 rounded-lg font-bold transition bg-lime-300 text-zinc-950';
    tabReg.className = 'py-2 rounded-lg font-bold transition text-zinc-400 hover:text-white';
    title.textContent = '歡迎回來';
    sub.textContent = '登入你的帳號，預約課程、私訊老師或管理排程。';
  }
}

function toggleRegTeacherFields() {
  const role = document.querySelector('input[name="reg-role"]:checked')?.value;
  const box = document.getElementById('reg-teacher-fields');
  if (box) box.classList.toggle('hidden', role !== 'teacher');
}

function updateRegPasswordHints() {
  const pwd = document.getElementById('reg-password')?.value || '';
  const check = validatePasswordStrength(pwd);
  const setPill = (id, ok, text) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = (ok ? '✓ ' : '○ ') + text;
    el.className = ok
      ? 'px-2 py-0.5 rounded-md bg-lime-300/20 text-lime-300 border border-lime-300/30 font-medium'
      : 'px-2 py-0.5 rounded-md bg-zinc-800 text-zinc-400';
  };
  setPill('pwd-rule-upper', check.hasUpper, '至少 1 個大寫英文 (A-Z)');
  setPill('pwd-rule-lower', check.hasLower, '至少 1 個小寫英文 (a-z)');
  setPill('pwd-rule-digits', check.hasFiveDigits, `至少 5 位數字 (${Math.min(check.digitCount, 5)}/5)`);
}

async function handleRegPhotoUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const dataUrl = await compressImageFile(file, 400, 0.78);
    window.__regPhotoData = dataUrl;
    const prev = document.getElementById('reg-photo-preview');
    if (prev) {
      prev.classList.remove('hidden');
      prev.innerHTML = `<img src="${dataUrl}" class="w-12 h-12 rounded-xl object-cover border border-lime-300/40" /><span class="text-xs text-lime-300">已載入照片預覽</span>`;
    }
  } catch (err) {
    showToast(err.message || '圖片處理失敗', 'error');
  }
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  const pwdEl = document.getElementById('login-password');
  const u = (document.getElementById('login-username')?.value || '').replace(/[^\x21-\x7E]/g, '').trim();
  const p = (pwdEl?.value || '').replace(/[^\x21-\x7E]/g, '');
  if (pwdEl) pwdEl.value = '';

  const adm = state.admins.find(a => a.username === u);
  if (adm && await verifyPasswordRecord(adm, p)) {
    state.session = { role: 'admin', id: adm.id };
    saveState();
    closeModal();
    ui.tab = 'portal';
    showToast(`歡迎回來，${adm.name}`);
    render();
    return;
  }

  const teacher = state.teachers.find(t => t.username === u);
  if (teacher && await verifyPasswordRecord(teacher, p)) {
    state.session = { role: 'teacher', id: teacher.id };
    saveState();
    closeModal();
    ui.tab = 'portal';
    showToast(`歡迎回來，${teacher.name} 老師！`);
    render();
    return;
  }

  const student = state.students.find(s => s.username === u);
  if (student && await verifyPasswordRecord(student, p)) {
    state.session = { role: 'student', id: student.id };
    saveState();
    closeModal();
    ui.tab = 'lobby';
    showToast(`歡迎回來，${student.name}！`);
    render();
    return;
  }

  const pending = state.registrations.find(r => r.username === u && r.status === 'pending');
  if (pending) {
    showToast('此帳號目前尚在審核中，開通後即可登入使用。', 'warn');
    return;
  }

  showToast('帳號或密碼錯誤，請再試一次。', 'error');
}

async function handleRegisterSubmit(e) {
  e.preventDefault();
  const role = document.querySelector('input[name="reg-role"]:checked')?.value || 'student';
  const username = (document.getElementById('reg-username')?.value || '').replace(/[^\x21-\x7E]/g, '').trim();
  const name = (document.getElementById('reg-name')?.value || '').trim();
  const pwdEl = document.getElementById('reg-password');
  const pwd2El = document.getElementById('reg-password2');
  const password = (pwdEl?.value || '').replace(/[^\x21-\x7E]/g, '');
  const password2 = (pwd2El?.value || '').replace(/[^\x21-\x7E]/g, '');
  const region = document.getElementById('reg-region')?.value || '北部';
  const contact = (document.getElementById('reg-contact')?.value || '').trim();
  const bio = (document.getElementById('reg-bio')?.value || '').trim();

  if (username.length < 3) { showToast('帳號長度至少需 3 個字元。', 'error'); return; }
  if (isUsernameTaken(username)) { showToast('此帳號已被使用或正在審核中，請換一個帳號。', 'error'); return; }
  if (!validatePasswordStrength(password).valid) {
    showToast('密碼必須包含至少 1 個大寫英文、1 個小寫英文與 5 位以上數字。', 'error');
    return;
  }
  if (password !== password2) { showToast('兩次輸入的密碼不一致。', 'error'); return; }

  let styles = [], focusTags = [], teachingIntro = '';
  if (role === 'teacher') {
    styles = Array.from(document.querySelectorAll('input[name="reg-styles"]:checked')).map(el => el.value);
    focusTags = Array.from(document.querySelectorAll('input[name="reg-focus"]:checked')).map(el => el.value);
    teachingIntro = (document.getElementById('reg-teaching')?.value || '').trim();
    if (!styles.length) { showToast('請至少選擇一種擅長舞風。', 'error'); return; }
  }

  const pwdRecord = await createPasswordRecord(password);
  if (pwdEl) pwdEl.value = '';
  if (pwd2El) pwd2El.value = '';

  state.registrations.unshift({
    id: uid('reg'),
    role, username, ...pwdRecord, name, region, contact, bio,
    styles, focusTags, teachingIntro,
    photo: role === 'teacher' ? (window.__regPhotoData || '') : '',
    status: 'pending',
    createdAt: nowStr()
  });
  window.__regPhotoData = '';
  saveState();
  closeModal();
  showToast('註冊申請已送出！待平台審核開通後即可登入使用。');
  render();
}

function logout() {
  state.session = { role: 'guest', id: null };
  ui.tab = 'lobby';
  ui.activeChatTarget = 'support';
  saveState();
  showToast('已安全登出');
  render();
}

  if (user.role !== 'student') {

    return;

  const t = getTeacherById(teacherId);

        </div>
        <button type="submit" class="px-5 py-2.5 rounded-xl bg-lime-300 hover:bg-lime-200 text-zinc-950 font-bold text-sm transition">確認預約並託管</button>
      </div>
    </form>
  `);

function submitBooking(e, teacherId, slotId) {
  e.preventDefault();
  const student = getStudentById(state.session.id);
  const teacher = getTeacherById(teacherId);
  const slot = teacher ? (teacher.slots || []).find(s => s.id === slotId) : null;
  if (!student || !teacher || !slot || getSlotRemaining(slot) <= 0) {
    showToast('此課程名額已滿。', 'error');
    return;
  }

  const totalPoints = Number(slot.price || 0);
  if (student.points < totalPoints) {
    showToast(`點數不足（需 ${totalPoints} pts，目前 ${student.points} pts），請至聊天室聯繫管理員儲值。`, 'error');
    return;
  }

  student.points -= totalPoints;
  state.escrowPoolPoints += totalPoints;
  slot.enrolledCount = Number(slot.enrolledCount || 0) + 1;
  if (getSlotRemaining(slot) <= 0) slot.status = 'booked';

  state.bookings.unshift({
    id: uid('bk'),
    studentId: student.id,
    teacherId: teacher.id,
    slotId: slot.id,
    courseTitle: slot.title || '私教課程',
    courseType: slot.courseType || '1on1',
    date: slot.date,
    time: slot.time,
    region: slot.region,
    location: slot.location,
    totalPoints,
    status: 'escrowed',
    needCard: {
      goal: document.getElementById('bk-goal').value.trim(),
      level: document.getElementById('bk-level').value.trim(),
      note: document.getElementById('bk-note').value.trim()
    },
    createdAt: nowStr(),
    completedAt: null
  });

  state.ledger.unshift({
    id: uid('lg'),
    type: 'escrow_lock',
    desc: `${student.name} 預約 ${teacher.name}「${slot.title}」`,
    amount: totalPoints,
    createdAt: nowStr()
  });

  saveState();
  closeModal();
  showToast('預約成功！點數已託管，可至「我的課程」查看。');
  navigate('portal');
}

function submitWishCourse(e) {
  e.preventDefault();
  const s = getStudentById(state.session.id);
  if (!s) return;
  state.wishes.unshift({
    id: uid('w'),
    studentId: s.id,
    studentName: s.name,
    style: document.getElementById('w-style').value,
    focus: document.getElementById('w-focus').value,
    region: document.getElementById('w-region').value,
    courseType: document.getElementById('w-type').value,
    targetTeacherId: document.getElementById('w-teacher').value,
    note: document.getElementById('w-note').value.trim(),
    upvoters: [s.id],
    createdAt: nowStr()
  });
  saveState();
  closeModal();
  showToast('許願已發布！老師與其他同學現在都能看到囉。');
  render();
}

function toggleWishUpvote(wishId) {
  const user = getCurrentUser();
  if (!user) { openAuthModal('login'); showToast('請先登入再附議許願。', 'warn'); return; }
  if (user.role !== 'student') { showToast('此按鈕提供學生附議使用。', 'warn'); return; }
  const w = state.wishes.find(x => x.id === wishId);
  if (!w) return;
  w.upvoters = w.upvoters || [];
  const idx = w.upvoters.indexOf(user.id);
  if (idx >= 0) w.upvoters.splice(idx, 1);
  else w.upvoters.push(user.id);
  saveState();
  render();
}

function deleteWish(wishId) {
  state.wishes = state.wishes.filter(w => w.id !== wishId);
  saveState();
  showToast('已移除許願');
  render();
}

function teacherFulfillWish(wishId) {
  const w = state.wishes.find(x => x.id === wishId);
  if (!w) return;
  ui.prefillSlot = {
    title: `${w.style}（${w.focus}）許願開班`,
    region: w.region,
    courseType: w.courseType === '多人小班' ? 'group' : '1on1',
    desc: `回應許願：${w.note}`
  };
  ui.teacherTab = 'slots';
  navigate('portal');
  showToast('已帶入許願資訊，請確認價格與時間後開課！');
}

function toggleEventAttend(eventId) {
  const user = getCurrentUser();
  if (!user) { openAuthModal('login'); showToast('請先登入再標記參加。', 'warn'); return; }

  if (!ev) return;
  ev.attendees = ev.attendees || [];
  const idx = ev.attendees.findIndex(a => a.userId === user.id && a.role === user.role);
  if (idx >= 0) { ev.attendees.splice(idx, 1); showToast('已取消標記參加'); }
  else { ev.attendees.push({ userId: user.id, role: user.role, name: user.name }); showToast('已標記「我會去」！'); }
  saveState();
  render();
}

function submitEventComment(e, eventId) {
  e.preventDefault();
  const user = getCurrentUser();
  if (!user || (user.role !== 'student' && user.role !== 'teacher')) return;
  const ev = state.events.find(x => x.id === eventId);
  const text = (document.getElementById('ev-cmt-' + eventId)?.value || '').trim();
  if (!ev || !text) return;
  ev.comments = ev.comments || [];
  ev.comments.push({ id: uid('ec'), userId: user.id, role: user.role, name: user.name, text, createdAt: nowStr() });
  saveState();
  render();
}

function deleteEventComment(eventId, commentId) {
  const ev = state.events.find(x => x.id === eventId);
  if (!ev) return;
  ev.comments = (ev.comments || []).filter(c => c.id !== commentId);
  saveState();
  render();
}

function sendActiveChatMessage(e) {
  e.preventDefault();
  const user = getCurrentUser();
  if (!user) return;
  const inp = document.getElementById('chat-room-input');
  let text = (inp?.value || '').trim();
  if (!text) return;

  if (ui.activeChatTarget === 'support') {
    state.supportChats[user.id] = state.supportChats[user.id] || [];
    state.supportChats[user.id].push({ id: uid('sc'), sender: user.role, name: user.name, text, createdAt: nowStr(), ts: Date.now() });
  } else {
    const chat = state.pairChats[ui.activeChatTarget];
    if (!chat) return;
    const unlocked = hasActiveEscrowBetween(chat.studentId, chat.teacherId);
    let flagged = false;
    if (!unlocked && detectSensitiveContact(text)) {
      flagged = true;
      chat.flagged = true;
      text = maskContactText(text);
      showToast('未成課前系統已自動遮蔽外部聯絡資訊，請透過平台預約保障權益。', 'warn');
    }
    chat.messages.push({ id: uid('pm'), senderRole: user.role, senderName: user.name, text, createdAt: nowStr(), flagged });
    chat.updatedAt = Date.now();
  }
  saveState();
  render();
}

function sendChatSticker(stickerId) {
  const user = getCurrentUser();
  if (!user) return;
  if (ui.activeChatTarget === 'support') {
    state.supportChats[user.id] = state.supportChats[user.id] || [];
    state.supportChats[user.id].push({ id: uid('sc'), sender: user.role, name: user.name, stickerId, text: '', createdAt: nowStr(), ts: Date.now() });
  } else {
    const chat = state.pairChats[ui.activeChatTarget];
    if (!chat) return;
    chat.messages.push({ id: uid('pm'), senderRole: user.role, senderName: user.name, stickerId, text: '', createdAt: nowStr(), flagged: false });
    chat.updatedAt = Date.now();
  }
  ui.stickerPickerOpen = false;
  saveState();
  render();
}

function adminSendSupportChat(e, targetUid) {
  e.preventDefault();

function confirmCompleteBooking(bkId) {
  const b = state.bookings.find(x => x.id === bkId && x.status === 'escrowed');
  if (!b) return;
  const teacher = getTeacherById(b.teacherId);
  const student = getStudentById(b.studentId);
  const fee = Math.round(b.totalPoints * (state.commissionRate / 100));
  const net = b.totalPoints - fee;

  b.status = 'completed';
  b.completedAt = nowStr();
  state.escrowPoolPoints = Math.max(0, state.escrowPoolPoints - b.totalPoints);
  if (teacher) teacher.points += net;
  if (student) student.completedCount = (student.completedCount || 0) + 1;

  state.ledger.unshift({
    id: uid('lg'),
    type: 'payout',
    desc: `完課撥款給 ${teacher ? teacher.name : '老師'}（實領 ${net} pts，服務費 ${fee} pts）`,
    amount: net,
    createdAt: nowStr()
  });
  saveState();
  showToast('已確認完課並撥款給老師！');
  render();
}

function cancelBookingByStudent(bkId) {
  const b = state.bookings.find(x => x.id === bkId && x.status === 'escrowed');
  if (!b) return;
  const student = getStudentById(b.studentId);
  const teacher = getTeacherById(b.teacherId);

  b.status = 'cancelled';
  state.escrowPoolPoints = Math.max(0, state.escrowPoolPoints - b.totalPoints);
  if (student) student.points += b.totalPoints;
  if (teacher && b.slotId) {
    const sl = (teacher.slots || []).find(s => s.id === b.slotId);
    if (sl) {
      sl.enrolledCount = Math.max(0, Number(sl.enrolledCount || 1) - 1);
      sl.status = 'open';
    }
  }
  state.ledger.unshift({
    id: uid('lg'),
    type: 'refund',
    desc: `${student ? student.name : '學生'} 取消預約，全額退還託管點數`,
    amount: -b.totalPoints,
    createdAt: nowStr()
  });
  saveState();
  showToast('已取消預約，託管點數已全額退回。');
  render();
}

function openReviewModal(teacherId) {
  const t = getTeacherById(teacherId);
  if (!t) return;
  openModal(`
    <form onsubmit="submitReview(event, '${t.id}')" class="space-y-4">
      <h3 class="text-lg font-bold text-white">評價 ${esc(t.name)} 老師</h3>
      <div>
        <label class="block text-xs text-zinc-400 mb-1">評分</label>
        <select id="rv-rating" class="w-full px-3 py-2 rounded-xl bg-obsidian border border-white/10 text-sm text-white">
          <option value="5">★★★★★ 5 分</option>
          <option value="4">★★★★☆ 4 分</option>
          <option value="3">★★★☆☆ 3 分</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-zinc-400 mb-1">上課心得</label>
        <textarea id="rv-text" rows="3" required placeholder="分享這堂課的收穫..." class="w-full px-3 py-2 rounded-xl bg-obsidian border border-white/10 text-sm text-white"></textarea>
      </div>
      <button type="submit" class="w-full py-2.5 rounded-xl bg-lime-300 text-zinc-950 font-bold text-sm">送出評價</button>
    </form>
  `);
}

function submitReview(e, teacherId) {
  e.preventDefault();
  const s = getStudentById(state.session.id);
  const t = getTeacherById(teacherId);
  if (!s || !t) return;
  t.reviews = t.reviews || [];
  t.reviews.unshift({ id: uid('rv'), studentId: s.id, studentName: s.name, rating: Number(document.getElementById('rv-rating').value || 5), text: document.getElementById('rv-text').value.trim(), createdAt: nowStr() });
  saveState();
  closeModal();
  showToast('感謝你的課後評價！');
  render();
}

function toggleSlotMaxInput() {
  const type = document.getElementById('sl-type')?.value;
  const maxInp = document.getElementById('sl-max');
  if (!maxInp) return;
  if (type === '1on1') { maxInp.value = 1; }
  else if (Number(maxInp.value) <= 1) { maxInp.value = 4; }
}

function addTeacherSlot(e) {
  e.preventDefault();
  const t = getTeacherById(state.session.id);
  if (!t) return;
  if (!getTeacherProfileCompletion(t).canOpenCourse) {
    showToast('請先完成個人基本資料（含大頭貼）再進行開課。', 'error');
    return;
  }
  const courseType = document.getElementById('sl-type').value;
  const maxStudents = courseType === '1on1' ? 1 : Math.max(2, Number(document.getElementById('sl-max').value || 2));
  t.slots = t.slots || [];
  t.slots.unshift({
    id: uid('sl'),
    title: document.getElementById('sl-title').value.trim(),
    courseType,
    maxStudents,
    enrolledCount: 0,
    price: Math.max(100, Number(document.getElementById('sl-price').value || 1000)),
    date: document.getElementById('sl-date').value,
    time: document.getElementById('sl-time').value.trim(),
    region: document.getElementById('sl-region').value,
    location: document.getElementById('sl-loc').value.trim(),
    desc: document.getElementById('sl-desc').value.trim(),
    status: 'open'
  });
  ui.prefillSlot = null;
  saveState();
  showToast('課程已上架！學生現在可以在首頁看到並預約了。');
  render();
}

function deleteTeacherSlot(slotId) {
  const t = getTeacherById(state.session.id);
  if (!t) return;
  t.slots = (t.slots || []).filter(s => s.id !== slotId);
  saveState();
  showToast('已下架課程');
  render();
}

async function handleTeacherAvatarUpload(e, teacherId) {
  const file = e.target.files?.[0];
  if (!file) return;
  const t = getTeacherById(teacherId);
  if (!t) return;
  try {
    t.photo = await compressImageFile(file, 420, 0.78);
    saveState();
    showToast('大頭貼已更新！');
    render();
  } catch (err) {
    showToast(err.message || '圖片上傳失敗', 'error');
  }
}

function removeTeacherAvatar(teacherId) {
  const t = getTeacherById(teacherId);
  if (!t) return;
  t.photo = '';
  saveState();
  showToast('已移除大頭貼');
  render();
}

async function handleTeacherGalleryUpload(e, teacherId) {
  const file = e.target.files?.[0];
  if (!file) return;
  const t = getTeacherById(teacherId);
  if (!t) return;
  t.gallery = t.gallery || [];
  if (t.gallery.length >= 4) { showToast('作品照片最多上傳 4 張。', 'warn'); return; }
  try {
    t.gallery.push(await compressImageFile(file, 680, 0.75));
    saveState();
    showToast('已新增作品照片！');
    render();
  } catch (err) {
    showToast(err.message || '圖片上傳失敗', 'error');

function removeTeacherGalleryPhoto(teacherId, idx) {
  const t = getTeacherById(teacherId);
  if (!t || !t.gallery) return;
  t.gallery.splice(idx, 1);
  saveState();
  render();
}

function submitTeacherProfileApproval(e) {
  e.preventDefault();
  const t = getTeacherById(state.session.id);
  if (!t) return;
  const styles = Array.from(document.querySelectorAll('input[name="tp-styles"]:checked')).map(el => el.value);
  const focusTags = Array.from(document.querySelectorAll('input[name="tp-focus"]:checked')).map(el => el.value);
  if (!styles.length) { showToast('請至少勾選一種舞風', 'error'); return; }
  if (!focusTags.length) { showToast('請至少勾選一項教學面向', 'error'); return; }
  const after = {
    name: document.getElementById('tp-name').value.trim(),
    region: document.getElementById('tp-region').value,
    styles,
    focusTags,
    teachingIntro: document.getElementById('tp-teaching').value.trim(),
    bio: document.getElementById('tp-bio').value.trim(),
    contact: document.getElementById('tp-contact').value.trim(),
    videoUrl: document.getElementById('tp-video').value.trim()
  };

  // 若老師尚未完成初始基本資料，直接更新以便即時解鎖開課；已完成者走審核流
  if (!getTeacherProfileCompletion(t).canOpenCourse) {
    Object.assign(t, after);
    saveState();
    showToast('基本資料已儲存！' + (getTeacherProfileCompletion(t).canOpenCourse ? '已解鎖開課功能！' : '請記得上傳個人大頭貼即可開課。'));
    render();
    return;
  }

  requireGanConfirm('確認送出個人檔案變更申請？', '送出後將由平台審核，核准後即同步更新你的公開頁面。', () => {
    state.approvals.unshift({
      id: uid('ap'),
      targetRole: 'teacher',
      targetId: t.id,
      targetName: t.name,
      before: { name: t.name, region: t.region, styles: t.styles, focusTags: t.focusTags, teachingIntro: t.teachingIntro, bio: t.bio, contact: t.contact },
      after,
      status: 'pending',
      createdAt: nowStr()
    });
    saveState();
    showToast('變更申請已送出！');
    render();
  });
}

function reportStudentNoShow(bkId) {
  const b = state.bookings.find(x => x.id === bkId && x.status === 'escrowed');
  if (!b) return;
  requireGanConfirm('確認回報學生爽約？', '回報後將計入學生出席紀錄，託管點數將扣除服務費後補償予老師。', () => {
    const teacher = getTeacherById(b.teacherId);
    const student = getStudentById(b.studentId);
    const fee = Math.round(b.totalPoints * (state.commissionRate / 100));
    const net = b.totalPoints - fee;
    b.status = 'noshow';
    state.escrowPoolPoints = Math.max(0, state.escrowPoolPoints - b.totalPoints);
    if (teacher) teacher.points += net;
    if (student) student.noShowCount = (student.noShowCount || 0) + 1;
    state.ledger.unshift({ id: uid('lg'), type: 'noshow_comp', desc: `學生爽約補償撥款給 ${teacher ? teacher.name : '老師'}`, amount: net, createdAt: nowStr() });
    saveState();
    showToast('已回報爽約並完成補償撥款');
    render();
  });
}

function approveRegistration(regId) {
  const reg = state.registrations.find(r => r.id === regId && r.status === 'pending');
  if (!reg) return;
  const pwdFields = {
    passwordHash: reg.passwordHash,
    passwordSalt: reg.passwordSalt,
    hashIterations: reg.hashIterations || PASSWORD_HASH_ITERATIONS
  };
  if (reg.role === 'teacher') {
    state.teachers.push({
      id: uid('t'),
      username: reg.username,
      ...pwdFields,
      name: reg.name,
      styles: reg.styles && reg.styles.length ? reg.styles : ['HipHop'],
      focusTags: reg.focusTags && reg.focusTags.length ? reg.focusTags : [],
      region: reg.region,
      videoUrl: '',
      teachingIntro: reg.teachingIntro || '',
      bio: reg.bio || '',
      contact: reg.contact || '',
      photo: reg.photo || '',
      gallery: [],
      points: 0,
      slots: [],
      reviews: []
    });
  } else {
    state.students.push({
      id: uid('s'),
      username: reg.username,
      ...pwdFields,
      name: reg.name,
      region: reg.region,
      points: 0,
      contact: reg.contact || '',
      completedCount: 0,
      noShowCount: 0,
      bio: reg.bio || ''
    });
  }
  reg.status = 'approved';
  saveState();
  showToast(`已核准開通「${reg.name}」的帳號！`);
  render();
}

function approveAllRegistrations() {
  state.registrations.filter(r => r.status === 'pending').forEach(r => approveRegistration(r.id));
}

function rejectRegistration(regId) {
  const reg = state.registrations.find(r => r.id === regId);
  if (!reg) return;
  reg.status = 'rejected';
  saveState();
  showToast(`已婉拒「${reg.name}」的註冊申請`);
  render();
}

function resolveApproval(apId, approve) {
  const ap = state.approvals.find(a => a.id === apId && a.status === 'pending');
  if (!ap) return;
  if (approve) {
    const target = ap.targetRole === 'teacher' ? getTeacherById(ap.targetId) : getStudentById(ap.targetId);
    if (target) Object.assign(target, ap.after);
    ap.status = 'approved';
    showToast(`已核准「${ap.targetName}」的資料更新`);
  } else {
    ap.status = 'rejected';
    showToast(`已駁回「${ap.targetName}」的資料變更`);
  }
  saveState();
  render();
}

function clearPairFlag(key) {
  if (state.pairChats[key]) { state.pairChats[key].flagged = false; saveState(); render(); }
}

function adminIntervenePair(e, key) {
  e.preventDefault();
  const text = (document.getElementById('adm-iv-' + key)?.value || '').trim();
  if (!text || !state.pairChats[key]) return;
  state.pairChats[key].messages.push({ id: uid('pm'), senderRole: 'admin', senderName: '平台客服', text, createdAt: nowStr(), flagged: false });
  state.pairChats[key].flagged = false;
  saveState();
  showToast('已送出介入提醒');
  render();
}

function quickAdjustPoints(role, id, delta) {
  const u = role === 'teacher' ? getTeacherById(id) : getStudentById(id);
  if (!u) return;
  u.points = Math.max(0, Number(u.points || 0) + delta);
  state.ledger.unshift({ id: uid('lg'), type: 'admin_adjust', desc: `管理員調整 ${u.name} 點數 (${delta >= 0 ? '+' : ''}${delta} pts)`, amount: delta, createdAt: nowStr() });
  saveState();
  showToast(`已更新 ${u.name} 點數為 ${u.points.toLocaleString()} pts`);
  render();
}

async function updateCurrentAdminCreds(e) {

  render();
}

function deleteAdminAccount(admId) {
  if (state.admins.length <= 1) { showToast('系統至少需保留一位管理員。', 'error'); return; }
  const a = getAdminById(admId);
  if (!a) return;
  requireGanConfirm(`確認刪除管理員「${a.name}」？`, '刪除後該帳號將立即失去管理權限。', () => {
    state.admins = state.admins.filter(x => x.id !== admId);
    saveState();
    showToast(`已刪除管理員「${a.name}」`);
    render();
  });
}

function renderAdminFinanceTab() {
  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="p-5 rounded-2xl bg-card border border-white/10 space-y-4 h-fit">
        <h3 class="text-base font-bold text-white">平台抽成與資料備份</h3>
        <div class="flex items-center gap-3">
          <label class="text-xs text-zinc-400">完課服務費比例 (%)</label>
          <input id="cfg-rate" type="number" min="0" max="50" value="${state.commissionRate}" class="w-24 px-3 py-1.5 rounded-xl bg-obsidian border border-white/10 text-sm text-white" />
          <button onclick="state.commissionRate=Math.max(0,Math.min(50,Number(document.getElementById('cfg-rate').value||10))); saveState(); showToast('已更新服務費比例'); render()" class="px-3.5 py-1.5 rounded-xl bg-lime-300 text-zinc-950 font-bold text-xs">儲存</button>
        </div>
        <div class="flex flex-wrap gap-2 pt-2 border-t border-white/10">
          <button onclick="exportStateJSON()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white">匯出 JSON 備份</button>
          <label class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold text-white cursor-pointer">
            匯入 JSON 還原
            <input type="file" accept="application/json" onchange="importStateJSON(event)" class="hidden" />
          </label>
          <button onclick="resetSystemData()" class="px-4 py-2 rounded-xl bg-red-500/15 hover:bg-red-500/30 text-xs font-bold text-red-300">重置系統資料</button>
        </div>
      </div>

      <div class="p-5 rounded-2xl bg-card border border-white/10 space-y-3">
        <h3 class="text-base font-bold text-white">點數流水帳（最近 20 筆）</h3>
        <div class="space-y-2 max-h-72 overflow-y-auto scrollbar-thin">
          ${state.ledger.slice(0, 20).map(l => `
            <div class="p-3 rounded-xl bg-obsidian border border-white/5 flex items-center justify-between gap-2 text-xs">
              <div>
                <div class="text-zinc-200">${esc(l.desc)}</div>
                <div class="text-[10px] text-zinc-500">${esc(l.createdAt)}</div>
              </div>
              <span class="font-mono font-bold ${l.amount >= 0 ? 'text-lime-300' : 'text-red-300'}">${l.amount >= 0 ? '+' : ''}${Number(l.amount).toLocaleString()}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function exportStateJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `8count_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出系統備份檔');
}

function importStateJSON(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.teachers || !parsed.students) throw new Error('格式不符');
      state = { ...createInitialState(), ...parsed };
      await migratePlaintextPasswordsIfNeeded();
      saveState();
      showToast('已還原系統備份資料！');
      render();
    } catch (err) {
      showToast('備份檔格式錯誤，無法匯入。', 'error');
    }
  };
  reader.readAsText(file);
}

function resetSystemData() {
  requireGanConfirm('確認重置所有系統資料？', '此操作將清除所有目前紀錄並恢復初始預設狀態。', () => {
    state = createInitialState();
    saveState();
    ui.tab = 'lobby';
    showToast('系統資料已重置');
    render();
  });
}

// ==========================================
// 主渲染函式
// ==========================================
function render() {
  renderHeader();
  const main = document.getElementById('app-main');
  const user = getCurrentUser();

  if (ui.tab === 'chat') {
    if (!user) { ui.tab = 'lobby'; }
    else {
      main.innerHTML = renderChatRoomPage();
      const box = document.getElementById('chat-messages-box');
      if (box) box.scrollTop = box.scrollHeight;
      return;
    }
  }

  if (ui.tab === 'portal') {
    if (!user) { ui.tab = 'lobby'; }
    else if (user.role === 'student') { main.innerHTML = renderStudentPortal(); return; }
    else if (user.role === 'teacher') { main.innerHTML = renderTeacherPortal(); return; }
    else if (user.role === 'admin') { main.innerHTML = renderAdminPanel(); return; }
  }

  if (ui.tab === 'events') {
    main.innerHTML = renderEventsPage();
  } else if (ui.tab === 'wishes') {
    main.innerHTML = renderWishesPage();
  } else {
    main.innerHTML = renderLobby();
  }
}

(async () => {
  await migratePlaintextPasswordsIfNeeded();
  render();
})();
</script>
</body>
</html>
